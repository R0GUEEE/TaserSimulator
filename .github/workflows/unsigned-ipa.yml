name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Stun Fun unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive without signing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project StunFun.xcodeproj \
            -scheme StunFun \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/StunFun.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$PWD/build/StunFun.xcarchive/Products/Applications/Stun Fun.app"
          test -d "$APP"
          rm -rf build/Payload build/StunFun-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry StunFun-unsigned.ipa Payload)
          ls -lh build/StunFun-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StunFun-unsigned-ipa
          path: build/StunFun-unsigned.ipa
          if-no-files-found: error
