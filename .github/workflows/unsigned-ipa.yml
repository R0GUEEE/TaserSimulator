name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Taser Simulator unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive without signing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project TaserSimulator.xcodeproj \
            -scheme TaserSimulator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/TaserSimulator.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$PWD/build/TaserSimulator.xcarchive/Products/Applications/TaserSimulator.app"
          test -d "$APP"
          rm -rf build/Payload build/TaserSimulator-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry TaserSimulator-unsigned.ipa Payload)
          ls -lh build/TaserSimulator-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaserSimulator-unsigned-ipa
          path: build/TaserSimulator-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Create/update release on main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unsigned-${{ github.run_number }}
          name: Taser Simulator unsigned ${{ github.run_number }}
          files: build/TaserSimulator-unsigned.ipa
          make_latest: true
