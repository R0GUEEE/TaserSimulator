name: Build signed IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: signed-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign, and upload Stun Fun
    runs-on: macos-15

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: com.r0gueee.stunfun
      DEFAULT_SIMULATOR: iPhone 15 Pro Max
      KEYCHAIN_PASSWORD: temporary-ci-keychain-password
      P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build tools
        run: |
          brew install xcodegen
          gem install fastlane -N
          gem install fastlane-plugin-altool -N

      - name: Validate signing and upload secrets
        run: |
          set -euo pipefail
          test -n "${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}"
          test -n "${{ secrets.STUNFUN_MOBILEPROVISION_BASE64 }}"
          test -n "$APPLE_TEAM_ID"
          test -n "$P12_PASSWORD"
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_API_KEY_BASE64"

      - name: Install signing certificate, profile, and ASC key
        run: |
          set -euo pipefail
          mkdir -p build/signing "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/private_keys"
          printf '%s' '${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}' | base64 --decode > build/signing/distribution.p12
          printf '%s' '${{ secrets.STUNFUN_MOBILEPROVISION_BASE64 }}' | base64 --decode > build/signing/StunFun.mobileprovision
          KEY_FILE="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Fail fast with a clear message if the stored API key is not a usable .p8,
          # instead of surfacing a confusing altool/xcodebuild format error later.
          KEY_HEAD="$(head -c 27 "$KEY_FILE")"
          echo "API key file: $KEY_FILE ($(wc -c < "$KEY_FILE" | tr -d ' ') bytes, starts with '$KEY_HEAD')"
          case "$KEY_HEAD" in
            '-----BEGIN PRIVATE KEY-----') ;;
            *) echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 does not decode to a PEM .p8 private key"; exit 1 ;;
          esac
          openssl pkey -in "$KEY_FILE" -noout
          echo "API key validated as a usable private key."

          # Verify the P12 password before importing into the temporary keychain.
          openssl pkcs12 -in build/signing/distribution.p12 -passin pass:"$P12_PASSWORD" -nokeys -nodes >/tmp/p12-cert.pem

          PROFILE_PLIST="build/signing/profile.plist"
          security cms -D -i build/signing/StunFun.mobileprovision > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Using provisioning profile: $PROFILE_NAME ($PROFILE_UUID) for $PROFILE_APP_ID"
          cp build/signing/StunFun.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" build/signing/stunfun.keychain-db
          security set-keychain-settings -lut 21600 build/signing/stunfun.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build/signing/stunfun.keychain-db
          security import build/signing/distribution.p12 \
            -k build/signing/stunfun.keychain-db \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s build/signing/stunfun.keychain-db login.keychain-db
          security default-keychain -s build/signing/stunfun.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build/signing/stunfun.keychain-db
          security find-identity -v -p codesigning build/signing/stunfun.keychain-db

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve default iPhone 15 Pro Max simulator
        run: |
          set -euo pipefail
          mkdir -p build
          DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro-Max"
          if xcrun simctl list devicetypes | grep -q "$DEVICE_TYPE"; then
            RUNTIME="$(xcrun simctl list runtimes | awk '/iOS .*\(.*available.*\)/ {print $NF}' | tr -d '()' | tail -n 1)"
            SIM_ID="$(xcrun simctl list devices available | awk -F'[()]' '/iPhone 15 Pro Max/ {print $2; exit}')"
            if [ -z "$SIM_ID" ] && [ -n "$RUNTIME" ]; then
              SIM_ID="$(xcrun simctl create "$DEFAULT_SIMULATOR" "$DEVICE_TYPE" "$RUNTIME")"
            fi
            echo "Using default simulator $DEFAULT_SIMULATOR (${SIM_ID:-not-created}) on ${RUNTIME:-unknown-runtime}"
            echo "DEFAULT_SIMULATOR_ID=${SIM_ID:-}" >> "$GITHUB_ENV"
          else
            echo "iPhone 15 Pro Max simulator type is not installed on this runner. App Store archive will still use generic iOS."
            xcrun simctl list devicetypes | grep 'Pro Max' || true
          fi

      - name: Archive signed app for App Store Connect
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project StunFun.xcodeproj \
            -scheme StunFun \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/StunFun.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="1.0" \
            | tee build/xcodebuild.log

      - name: Create App Store Connect export options
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/StunFun.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist" \
            | tee build/export.log
          IPA="$(find build/export -maxdepth 2 -type f -name '*.ipa' | head -n 1)"
          test -f "$IPA"
          cp "$IPA" build/StunFun-signed.ipa
          ls -lh build/StunFun-signed.ipa

      - name: Verify signed IPA
        run: |
          set -euo pipefail
          rm -rf build/verify
          mkdir -p build/verify
          unzip -q build/StunFun-signed.ipa -d build/verify
          APP="build/verify/Payload/Stun Fun.app"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee build/codesign-verify.log
          security cms -D -i "$APP/embedded.mobileprovision" > build/embedded-profile.plist
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' build/embedded-profile.plist

          # App Store validation rejects builds without a usable app icon, so fail fast here.
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Info.plist"
          test -f "$APP/Assets.car"
          ICON_COUNT=$(ls -1 "$APP"/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "loose icon pngs in bundle: $ICON_COUNT"
          ICON_NAMES=$(xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" 2>/dev/null | grep -c '"Name" : "AppIcon"' || true)
          echo "AppIcon entries in Assets.car: $ICON_NAMES"
          test "$ICON_COUNT" -gt 0 -o "$ICON_NAMES" -gt 0
          ls -lh "$APP"/*.png 2>/dev/null | head -12 || true

      - name: Upload signed IPA to TestFlight/App Store Connect with fastlane altool
        env:
          IPA_PATH: ${{ github.workspace }}/build/StunFun-signed.ipa
          FASTLANE_USER: dillinv@live.com
        run: |
          set -euo pipefail
          fastlane ios upload_altool

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StunFun-signed-ipa
          path: build/StunFun-signed.ipa
          if-no-files-found: error

      - name: Upload signing/build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-build-logs
          path: |
            build/simulator-build.log
            build/xcodebuild.log
            build/export.log
            build/codesign-verify.log
            build/ExportOptions.plist
          if-no-files-found: ignore

      - name: Create/update release on main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stunfun-signed-${{ github.run_number }}
          name: Stun Fun signed ${{ github.run_number }}
          files: build/StunFun-signed.ipa
          make_latest: true
