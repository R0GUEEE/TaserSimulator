name: TaserSimulator
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
targets:
  TaserSimulator:
    type: application
    platform: iOS
    sources:
      - TaserSimulator
    resources:
      - TaserSimulator/Resources
      - TaserSimulator/Assets.xcassets
    info:
      path: TaserSimulator/Info.plist
      properties:
        CFBundleDisplayName: Taser Sim
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSCameraUsageDescription: "Uses the flashlight LED for the taser simulator effect."
        UIRequiredDeviceCapabilities:
          - arm64
