name: StunFun
options:
  bundleIdPrefix: com.r0gueee
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  StunFun:
    type: application
    platform: iOS
    sources:
      - TaserSimulator
    resources:
      - TaserSimulator/Resources
      - TaserSimulator/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: "Stun Fun"
        EXECUTABLE_NAME: "StunFun"
        PRODUCT_BUNDLE_IDENTIFIER: com.r0gueee.stunfun
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: TaserSimulator/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Stun Fun
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
        INFOPLIST_KEY_UIDeviceFamily: [1]
        INFOPLIST_KEY_UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
