name: StunFun
options:
  bundleIdPrefix: com.r0gueee
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  StunFun:
    type: application
    platform: iOS
    sources:
      - TaserSimulator
    resources:
      - TaserSimulator/Resources
      - TaserSimulator/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: "Stun Fun"
        PRODUCT_BUNDLE_IDENTIFIER: com.r0gueee.stunfun
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIDeviceFamily: [1]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: TaserSimulator/Info.plist
      properties:
        CFBundleDisplayName: Stun Fun
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Uses the flashlight LED for the Stun Fun simulator effect."
        UIRequiredDeviceCapabilities:
          - arm64
